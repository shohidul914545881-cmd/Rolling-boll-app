name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          
          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected version string: $JAVA_VER_STR"
          
          if [ -z "$JAVA_VER_STR" ]; then
            echo "ERROR: Could not detect Java version" >&2
            exit 1
          fi
          
          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d'.' -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_STR" | cut -d'.' -f2)
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Java major version is not a valid number: $JAVA_MAJOR" >&2
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or newer. Found: $JAVA_MAJOR" >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or find ./debug.keystore" >&2
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have .apk extension" >&2
              exit 1
              ;;
          esac
          
          echo "APK successfully verified at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d "/tmp/apk-release-asset-XXXXXX")
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-zA-Z0-9._-]/-/g' -e 's/^-*//' -e 's/-*$//')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH" >&2
            exit 1
          fi
          
          echo "Prepared release asset: $ASSET_PATH"
          echo "Filename: $ASSET_FILENAME"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset validation failed before release creation." >&2
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Asset does not have .apk extension: $ASSET_PATH" >&2
              exit 1
              ;;
          esac
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES="### Automated Debug APK Build

- **Build Source**: Automatically built by GitHub Actions
- **Run Number**: ${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Commit SHA**: \`${{ github.sha }}\`
- **Release Asset**: \`${ASSET_NAME}\`

> [!NOTE]
> This APK is an automated debug build intended exclusively for testing and development.
> It is signed with a temporary Android debug keystore and is not a Play Store production release."
          
          gh release create "$TAG_NAME" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "### 🚀 Debug APK Release Published"
              echo ""
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **Release Title**: Debug APK Build #${{ github.run_number }}"
              echo "- **APK Filename**: \`$ASSET_NAME\`"
              echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "📱 You can download the APK directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) on your phone."
              echo ""
              echo "📦 The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped (outcome: $PUBLISH_OUTCOME)."
            echo "The APK build succeeded and the normal GitHub Actions artifact 'app-debug-apk' remains available."
            
            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "- The debug APK was built successfully."
              echo "- GitHub Actions artifact **\`app-debug-apk\`** was uploaded and is available for download under the workflow run artifacts."
              echo "- GitHub Release publishing failed or was skipped. Check runner permissions and workflow logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
